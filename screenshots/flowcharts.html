<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body{margin:0;padding:40px;background:#FFFFFF;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  .chart{background:#fff;padding:0}
  svg{display:block}
  svg .n-start{fill:#2F6BFF;stroke:none}
  svg .n-proc{fill:#FFFFFF;stroke:#2F6BFF;stroke-width:1.6}
  svg .n-data{fill:#F6F8FE;stroke:#2F6BFF;stroke-width:1.6}
  svg .n-dec{fill:#FFF8EC;stroke:#D9820B;stroke-width:1.6}
  svg .n-open{fill:#EAF0FF;stroke:#2F6BFF;stroke-width:2}
  svg .n-done{fill:#E7F8EF;stroke:#0F9D63;stroke-width:2}
  svg .n-gone{fill:#F1F3F7;stroke:#7A828F;stroke-width:1.6;stroke-dasharray:5 4}
  svg .n-note{fill:#FFFDF5;stroke:#D9CB8A;stroke-width:1.2;stroke-dasharray:4 3}
  svg .edge{stroke:#8A93A6;stroke-width:1.6;fill:none}
  svg text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#171B26;font-size:14px}
  svg .wt{fill:#FFFFFF;font-weight:600}
  svg .lbl{fill:#667085;font-size:12px}
  svg .sub{fill:#8A93A6;font-size:12px}
</style>
</head>
<body>

<!-- ============ 图 1：总体数据流图 ============ -->
<div class="chart" id="f1">
<svg width="920" height="600" viewBox="0 0 920 600">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A93A6"/>
    </marker>
  </defs>

  <!-- 角色 -->
  <rect class="n-start" x="100" y="24" width="180" height="44" rx="22"/>
  <text class="wt" x="190" y="48" text-anchor="middle" dominant-baseline="central">发布者（丢失 / 拾到）</text>
  <rect class="n-start" x="540" y="24" width="180" height="44" rx="22"/>
  <text class="wt" x="630" y="48" text-anchor="middle" dominant-baseline="central">浏览者（想帮忙的人）</text>

  <!-- 页面层 -->
  <rect class="n-proc" x="100" y="112" width="180" height="50" rx="10"/>
  <text x="190" y="131" text-anchor="middle" dominant-baseline="central">发布页 publish</text>
  <text class="sub" x="190" y="149" text-anchor="middle" dominant-baseline="central">寻物 / 招领 表单</text>
  <rect class="n-proc" x="440" y="112" width="380" height="50" rx="10"/>
  <text x="630" y="131" text-anchor="middle" dominant-baseline="central">首页 index · 搜索页 search · 详情页 detail</text>
  <text class="sub" x="630" y="149" text-anchor="middle" dominant-baseline="central">浏览 / 搜索 / 看详情 · 一键复制联系方式</text>

  <!-- 逻辑层 -->
  <rect class="n-data" x="90" y="236" width="200" height="50" rx="10"/>
  <text x="190" y="255" text-anchor="middle" dominant-baseline="central">validate.js</text>
  <text class="sub" x="190" y="273" text-anchor="middle" dominant-baseline="central">发布表单校验</text>
  <rect class="n-data" x="530" y="236" width="200" height="50" rx="10"/>
  <text x="630" y="255" text-anchor="middle" dominant-baseline="central">search.js</text>
  <text class="sub" x="630" y="273" text-anchor="middle" dominant-baseline="central">关键词搜索 · 三重筛选</text>

  <!-- 数据层 -->
  <rect class="n-data" x="90" y="352" width="640" height="52" rx="10"/>
  <text x="410" y="372" text-anchor="middle" dominant-baseline="central">core.js 数据层（增删改查 · 状态流转 · 我的发布归属）</text>
  <text class="sub" x="410" y="390" text-anchor="middle" dominant-baseline="central">resolveItem / reopenItem / removeItem / getMyItems</text>

  <!-- 存储 -->
  <rect class="n-data" x="160" y="478" width="500" height="56" rx="10"/>
  <text x="410" y="500" text-anchor="middle" dominant-baseline="central">localStorage（不可用时自动降级为内存存储）</text>
  <text class="sub" x="410" y="520" text-anchor="middle" dominant-baseline="central">clf_items：全部信息　·　clf_my_ids：本机发布的 id</text>

  <!-- 箭头 -->
  <line class="edge" x1="190" y1="68" x2="190" y2="108" marker-end="url(#a1)"/>
  <text class="lbl" x="198" y="94">填写并提交表单</text>
  <line class="edge" x1="630" y1="68" x2="630" y2="108" marker-end="url(#a1)"/>
  <text class="lbl" x="638" y="94">浏览 · 搜索 · 查看详情</text>

  <line class="edge" x1="190" y1="162" x2="190" y2="232" marker-end="url(#a1)"/>
  <text class="lbl" x="198" y="200">表单原始输入</text>
  <line class="edge" x1="630" y1="162" x2="630" y2="232" marker-end="url(#a1)"/>
  <text class="lbl" x="638" y="200">关键词 + 筛选条件</text>

  <line class="edge" x1="190" y1="286" x2="190" y2="348" marker-end="url(#a1)"/>
  <text class="lbl" x="198" y="322">合法数据 addItem()</text>
  <line class="edge" x1="630" y1="286" x2="630" y2="348" marker-end="url(#a1)"/>
  <text class="lbl" x="638" y="322">query() 组合查询</text>

  <line class="edge" x1="410" y1="404" x2="410" y2="474" marker-end="url(#a1)"/>
  <text class="lbl" x="418" y="444">写入 / 读取</text>

  <!-- 返回渲染流 -->
  <path class="edge" d="M730,378 L876,378 L876,137 L824,137" marker-end="url(#a1)"/>
  <text class="lbl" x="800" y="366">列表 · 详情渲染</text>

  <text class="lbl" x="100" y="572">注：「我的发布」的状态操作（标记已找到 / 已归还、恢复、删除）同样经 core.js 落库后刷新各页面。</text>
</svg>
</div>

<!-- ============ 图 2：发布信息流程图 ============ -->
<div class="chart" id="f2" style="margin-top:40px">
<svg width="600" height="700" viewBox="0 0 600 700">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A93A6"/>
    </marker>
  </defs>
  <rect class="n-start" x="60" y="16" width="260" height="44" rx="22"/>
  <text class="wt" x="190" y="40" text-anchor="middle" dominant-baseline="central">点击底部导航【发布】</text>
  <line class="edge" x1="190" y1="60" x2="190" y2="86" marker-end="url(#a2)"/>

  <rect class="n-proc" x="60" y="90" width="260" height="44" rx="10"/>
  <text x="190" y="114" text-anchor="middle" dominant-baseline="central">选择类型：寻物 / 招领</text>
  <line class="edge" x1="190" y1="134" x2="190" y2="160" marker-end="url(#a2)"/>

  <rect class="n-proc" x="45" y="164" width="290" height="56" rx="10"/>
  <text x="190" y="184" text-anchor="middle" dominant-baseline="central">填写表单：名称 / 分类 / 地点 /</text>
  <text x="190" y="202" text-anchor="middle" dominant-baseline="central">日期 / 称呼 / 联系方式 / 备注</text>
  <line class="edge" x1="190" y1="220" x2="190" y2="246" marker-end="url(#a2)"/>

  <rect class="n-proc" x="60" y="250" width="260" height="44" rx="10"/>
  <text x="190" y="266" text-anchor="middle" dominant-baseline="central">点击【立即发布】</text>
  <text class="sub" x="190" y="284" text-anchor="middle" dominant-baseline="central">validatePost() 逐字段校验</text>
  <line class="edge" x1="190" y1="294" x2="190" y2="320" marker-end="url(#a2)"/>

  <polygon class="n-dec" points="190,324 296,368 190,412 84,368"/>
  <text x="190" y="368" text-anchor="middle" dominant-baseline="central">校验通过？</text>
  <line class="edge" x1="190" y1="412" x2="190" y2="438" marker-end="url(#a2)"/>
  <text class="lbl" x="198" y="430">是</text>

  <rect class="n-data" x="60" y="442" width="260" height="56" rx="10"/>
  <text x="190" y="462" text-anchor="middle" dominant-baseline="central">core.addItem()：写入本机存储</text>
  <text x="190" y="480" text-anchor="middle" dominant-baseline="central">并记入「我的发布」</text>
  <line class="edge" x1="190" y1="498" x2="190" y2="524" marker-end="url(#a2)"/>

  <rect class="n-proc" x="60" y="528" width="260" height="44" rx="10"/>
  <text x="190" y="552" text-anchor="middle" dominant-baseline="central">弹出「发布成功」遮罩</text>
  <line class="edge" x1="190" y1="572" x2="190" y2="598" marker-end="url(#a2)"/>

  <rect class="n-start" x="45" y="602" width="290" height="44" rx="22"/>
  <text class="wt" x="190" y="626" text-anchor="middle" dominant-baseline="central">返回首页 / 查看详情 / 再发一条</text>

  <!-- 否分支 -->
  <line class="edge" x1="296" y1="368" x2="366" y2="368" marker-end="url(#a2)"/>
  <text class="lbl" x="308" y="360">否</text>
  <rect class="n-proc" x="370" y="330" width="170" height="76" rx="10"/>
  <text x="455" y="354" text-anchor="middle" dominant-baseline="central" style="font-size:12px">出错字段红框高亮</text>
  <text x="455" y="372" text-anchor="middle" dominant-baseline="central" style="font-size:12px">字段下方显示原因</text>
  <text x="455" y="390" text-anchor="middle" dominant-baseline="central" style="font-size:12px">toast 汇总提示</text>
  <path class="edge" d="M455,330 L455,192 L339,192" marker-end="url(#a2)"/>
</svg>
</div>

<!-- ============ 图 3：搜索与筛选流程图 ============ -->
<div class="chart" id="f3" style="margin-top:40px">
<svg width="620" height="660" viewBox="0 0 620 660">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A93A6"/>
    </marker>
  </defs>
  <rect class="n-start" x="60" y="16" width="260" height="44" rx="22"/>
  <text class="wt" x="190" y="40" text-anchor="middle" dominant-baseline="central">首页点击搜索框 / 热门词</text>
  <line class="edge" x1="190" y1="60" x2="190" y2="86" marker-end="url(#a3)"/>

  <rect class="n-proc" x="45" y="90" width="290" height="44" rx="10"/>
  <text x="190" y="114" text-anchor="middle" dominant-baseline="central">输入关键词（实时 / 回车触发）</text>
  <line class="edge" x1="190" y1="134" x2="190" y2="160" marker-end="url(#a3)"/>

  <rect class="n-proc" x="45" y="164" width="290" height="44" rx="10"/>
  <text x="190" y="188" text-anchor="middle" dominant-baseline="central">splitKeywords()：拆词 · 转小写</text>
  <line class="edge" x1="190" y1="208" x2="190" y2="234" marker-end="url(#a3)"/>

  <rect class="n-proc" x="45" y="238" width="290" height="56" rx="10"/>
  <text x="190" y="258" text-anchor="middle" dominant-baseline="central">逐条匹配：名称 / 地点 / 备注 /</text>
  <text x="190" y="276" text-anchor="middle" dominant-baseline="central">昵称包含全部关键词？</text>
  <line class="edge" x1="190" y1="294" x2="190" y2="320" marker-end="url(#a3)"/>

  <polygon class="n-dec" points="190,324 296,368 190,412 84,368"/>
  <text x="190" y="368" text-anchor="middle" dominant-baseline="central">有匹配结果？</text>
  <line class="edge" x1="190" y1="412" x2="190" y2="438" marker-end="url(#a3)"/>
  <text class="lbl" x="198" y="430">是</text>

  <rect class="n-proc" x="45" y="442" width="290" height="56" rx="10"/>
  <text x="190" y="462" text-anchor="middle" dominant-baseline="central">结果按发布时间倒序展示</text>
  <text x="190" y="480" text-anchor="middle" dominant-baseline="central">（已完成信息灰显 + 状态徽章）</text>
  <line class="edge" x1="190" y1="498" x2="190" y2="524" marker-end="url(#a3)"/>

  <rect class="n-proc" x="45" y="528" width="290" height="44" rx="10"/>
  <text x="190" y="552" text-anchor="middle" dominant-baseline="central">点击卡片 → 详情页联系发布者</text>
  <line class="edge" x1="190" y1="572" x2="190" y2="598" marker-end="url(#a3)"/>

  <rect class="n-start" x="60" y="602" width="260" height="44" rx="22"/>
  <text class="wt" x="190" y="626" text-anchor="middle" dominant-baseline="central">结束本次使用</text>

  <!-- 否分支 -->
  <line class="edge" x1="296" y1="368" x2="380" y2="368" marker-end="url(#a3)"/>
  <text class="lbl" x="308" y="360">否</text>
  <rect class="n-proc" x="384" y="322" width="190" height="92" rx="10"/>
  <text x="479" y="346" text-anchor="middle" dominant-baseline="central" style="font-size:12px">空状态兜底：</text>
  <text x="479" y="364" text-anchor="middle" dominant-baseline="central" style="font-size:12px">「没有找到相关物品」</text>
  <text x="479" y="382" text-anchor="middle" dominant-baseline="central" style="font-size:12px">提供「清空重搜」</text>
  <text x="479" y="400" text-anchor="middle" dominant-baseline="central" style="font-size:12px">与「去发布寻物」入口</text>
  <path class="edge" d="M479,322 L479,112 L339,112" marker-end="url(#a3)"/>
</svg>
</div>

<!-- ============ 图 4：信息状态流转图 ============ -->
<div class="chart" id="f4" style="margin-top:40px">
<svg width="800" height="560" viewBox="0 0 800 560">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A93A6"/>
    </marker>
  </defs>

  <rect class="n-open" x="90" y="60" width="220" height="70" rx="14"/>
  <text x="200" y="88" text-anchor="middle" dominant-baseline="central" style="font-weight:600">进行中 open</text>
  <text class="sub" x="200" y="110" text-anchor="middle" dominant-baseline="central">发布后默认状态，可被搜到</text>

  <rect class="n-done" x="450" y="60" width="220" height="70" rx="14"/>
  <text x="560" y="88" text-anchor="middle" dominant-baseline="central" style="font-weight:600">已完成 resolved</text>
  <text class="sub" x="560" y="110" text-anchor="middle" dominant-baseline="central">寻物 = 已找到　招领 = 已归还</text>

  <!-- 标记 / 恢复 -->
  <line class="edge" x1="310" y1="84" x2="446" y2="84" marker-end="url(#a4)"/>
  <text class="lbl" x="330" y="72">发布者标记</text>
  <line class="edge" x1="450" y1="112" x2="314" y2="112" marker-end="url(#a4)"/>
  <text class="lbl" x="316" y="138">误标记？一键恢复为进行中</text>

  <!-- 入口说明 -->
  <rect class="n-note" x="60" y="190" width="300" height="92" rx="10"/>
  <text x="210" y="212" text-anchor="middle" style="font-size:12.5px;font-weight:600">在哪里改？（仅发布者本人）</text>
  <text class="sub" x="210" y="234" text-anchor="middle">① 详情页「发布者操作面板」</text>
  <text class="sub" x="210" y="254" text-anchor="middle">② 「我的发布」列表行内按钮</text>
  <text class="sub" x="210" y="274" text-anchor="middle">判定方式：信息 id 属于本机 clf_my_ids</text>
  <path class="edge" d="M200,190 L200,134" marker-end="url(#a4)"/>

  <!-- 展示说明 -->
  <rect class="n-note" x="440" y="190" width="290" height="112" rx="10"/>
  <text x="585" y="212" text-anchor="middle" style="font-size:12.5px;font-weight:600">改了在哪里看到？（所有用户）</text>
  <text class="sub" x="585" y="234" text-anchor="middle">首页 / 搜索结果：卡片灰显 + 状态徽章</text>
  <text class="sub" x="585" y="254" text-anchor="middle">详情页：绿色横幅提示，避免无效联系</text>
  <text class="sub" x="585" y="274" text-anchor="middle">「我的发布」：进行中 / 已完成统计实时更新</text>
  <path class="edge" d="M560,190 L560,134" marker-end="url(#a4)"/>

  <!-- 已删除 -->
  <rect class="n-gone" x="270" y="345" width="220" height="58" rx="14"/>
  <text x="380" y="369" text-anchor="middle" dominant-baseline="central" style="font-weight:600">已删除（移出列表）</text>
  <text class="sub" x="380" y="389" text-anchor="middle" dominant-baseline="central">删除需二次确认，不可恢复</text>

  <!-- 删除绕行线（避开说明框） -->
  <path class="edge" d="M140,130 L140,155 L36,155 L36,374 L266,374" marker-end="url(#a4)"/>
  <text class="lbl" x="46" y="316">删除</text>
  <path class="edge" d="M650,130 L650,160 L764,160 L764,374 L494,374" marker-end="url(#a4)"/>
  <text class="lbl" x="712" y="316">删除</text>

  <text class="lbl" x="80" y="486">目的：物品找回 / 归还后及时闭环信息，减少重复询问与无效联系——</text>
  <text class="lbl" x="80" y="508">这正是本次作业要求的核心流程「发布 - 浏览/搜索 - 详情 - 联系 - 更新状态」的最后一环。</text>
</svg>
</div>
</body>
</html>
