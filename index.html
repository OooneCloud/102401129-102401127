<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园失物招领 · 首页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <div class="app">

    <header class="header">
      <div class="header-row">
        <div>
          <h1>校园失物招领</h1>
          <p class="slogan">丢东西？捡到东西？来这里发一条就好</p>
        </div>
      </div>
      <a class="searchbar" href="search.html">
        <span data-icon="search"></span>
        <span>搜索物品名称、地点或发布人</span>
      </a>
      <div class="chip-row" id="typeBar">
        <button class="chip is-active" data-type="all" type="button">全部</button>
        <button class="chip" data-type="lost" type="button">寻物</button>
        <button class="chip" data-type="found" type="button">招领</button>
      </div>
      <div class="chip-row" id="catBar"></div>
    </header>

    <main class="list-area">
      <div class="list-head">
        <span class="count" id="count">共 0 条信息</span>
        <div class="seg" id="statusSeg">
          <button type="button" data-status="all" class="is-active">全部</button>
          <button type="button" data-status="open">进行中</button>
          <button type="button" data-status="resolved">已完成</button>
        </div>
      </div>
      <div class="card-list" id="list"></div>
      <p class="foot-note" id="storageNote" style="display:none">
        当前浏览器限制了本地存储，数据仅本次会话有效；建议直接双击打开本页或参见 README。
      </p>
    </main>

    <nav class="bottomnav">
      <a href="index.html" data-nav="home">
        <span data-icon="home"></span><span>首页</span>
      </a>
      <a href="publish.html" data-nav="publish">
        <span data-icon="plus"></span><span>发布</span>
      </a>
      <a href="my-posts.html" data-nav="mine">
        <span data-icon="user"></span><span>我的</span>
      </a>
    </nav>
  </div>

  <script src="js/core.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/search.js"></script>
  <script src="js/util.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/page-index.js"></script>
</body>
</html>
